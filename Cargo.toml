[package]
name = "agent_minimal"
version = "0.1.0"
edition = "2024"

[dependencies]
eventsource-stream = "0.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = "0.3"
tokio = { version = "1.54.1", features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
] }
chrono = { version = "0.4.45", features = ["serde"] }
owo-colors = "4.4.0"
rustyline = { version = "18", features = ["with-file-history"] }
